# =============================================================================
# Deadband SCENARIO — demo_patrol_fleet
# =============================================================================
# A SCENARIO is a SCENE plus the FLEET. It names a scene and defines who is
# present and how they are wired — agents, bodies, sensors, radios, networks,
# authority and routing — and NOTHING about what they are doing. Tasking is a
# MISSION's job (missions/demo_patrol.yaml commands this fleet).
#
# Will's definition: fleet configuration and scene.
# =============================================================================

spec_version: 0.1
name: demo_patrol_fleet
kind: scenario

description: >
  Two cars on one centralized blue network, on the demo_field scene. Fleet only
  — no objectives. The fleet half of the demo triple.

scene: demo_field

networks:
  blue:
    system: friendly
    authority: centralized
    routing: star
    coordinator: car1
    topology: centralized

agents:
  - id: car1
    platform: roboracer
    network: blue
    dimensions:
      length: {value: 0.55, unit: m, source: "RoboRacer 1:10 nominal"}
      width:  {value: 0.30, unit: m, source: "RoboRacer 1:10 nominal"}
      height: {value: 0.20, unit: m, source: "RoboRacer 1:10 nominal"}
    pose: {x: -8.0, y: 8.0, z: 0.0, yaw: 0.0}
    performance: {max_speed: {value: 2.0, unit: "m/s", source: ""}}
    sensors:
      - {id: lidar, type: lidar_2d, mount: {offset: {x: 0.1, y: 0.0, z: 0.15}}}
  - id: car2
    platform: roboracer
    network: blue
    dimensions:
      length: {value: 0.55, unit: m, source: "RoboRacer 1:10 nominal"}
      width:  {value: 0.30, unit: m, source: "RoboRacer 1:10 nominal"}
      height: {value: 0.20, unit: m, source: "RoboRacer 1:10 nominal"}
    pose: {x: -8.0, y: -8.0, z: 0.0, yaw: 0.0}
    performance: {max_speed: {value: 2.0, unit: "m/s", source: ""}}
    sensors:
      - {id: lidar, type: lidar_2d, mount: {offset: {x: 0.1, y: 0.0, z: 0.15}}}
