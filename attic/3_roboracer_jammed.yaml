# =============================================================================
# Deadband FLEET — 3_roboracer_jammed
# =============================================================================
# The lab fleet, plus one RED jammer. The first genuinely CONTESTED run: a
# blue star on 2.4 GHz, and a red emitter on the same band whose power lands
# in every blue receiver's noise denominator the moment `red launch` arms it.
#
# A jammer is an ORDINARY agent with a `jammer:` block - no special physics,
# just an unwanted transmitter. See docs/contested-background.md.
#
# Run it:  Setup -> scene lab_box -> fleet 3_roboracer_jammed -> Play
#          SETMISSION test  ;  blue launch          (cars shuttle, clean)
#          red launch                               (jammer on - watch Comms)
# =============================================================================

spec_version: 0.1
name: 3_roboracer_jammed
kind: fleet

description: >
  The lab fleet (gcs + three cars on blue) plus jam1, a red jammer near the
  room centre. Arm it with `red launch` to contest the blue network.

networks:
  blue:
    system: friendly
    authority: centralized
    routing: star
    coordinator: gcs
    topology: centralized
    band: 2400
  red:
    system: adversary
    authority: decentralized
    routing: mesh
    topology: decentralized
    band: 2400

agents:
  - id: gcs
    platform: ground_station
    network: blue
    colour: "#6B7B85"
    pose: {x: 0.0, y: -3.4, z: 0.0, yaw: 1.5708}
    dimensions:
      length: {value: 0.40, unit: m, source: "Nominal - measure the bench"}
      width:  {value: 0.40, unit: m, source: "Nominal - measure the bench"}
      height: {value: 1.00, unit: m, source: "Nominal - measure the bench"}
    ghost: true
  - id: car1
    platform: roboracer
    network: blue
    colour: "#2E6FB0"
    pose: {x: -3.0, y: 2.0, z: 0.0, yaw: 0.0}
    dimensions:
      length: {value: 0.55, unit: m, source: "Measured, car #1, 2026-07-21"}
      width:  {value: 0.30, unit: m, source: "Measured, car #1, 2026-07-21"}
      height: {value: 0.20, unit: m, source: "Measured, car #1, 2026-07-21"}
    performance: {max_speed: {value: 1.5, unit: m/s, source: "Indoor safety"}}
    sensors:
      - {id: lidar, type: ust10lx, mount: {offset: {x: 0.12, y: 0.0, z: 0.18}}}
  - id: car2
    platform: roboracer
    network: blue
    colour: "#2E6FB0"
    pose: {x: -3.0, y: 0.0, z: 0.0, yaw: 0.0}
    dimensions:
      length: {value: 0.55, unit: m, source: "Measured, car #2, 2026-07-21"}
      width:  {value: 0.30, unit: m, source: "Measured, car #2, 2026-07-21"}
      height: {value: 0.20, unit: m, source: "Measured, car #2, 2026-07-21"}
    performance: {max_speed: {value: 1.5, unit: m/s, source: "Indoor safety"}}
    sensors:
      - {id: lidar, type: ust10lx, mount: {offset: {x: 0.12, y: 0.0, z: 0.18}}}
  - id: car3
    platform: roboracer
    network: blue
    colour: "#2E6FB0"
    pose: {x: -3.0, y: -2.0, z: 0.0, yaw: 0.0}
    dimensions:
      length: {value: 0.55, unit: m, source: "Measured, car #3, 2026-07-21"}
      width:  {value: 0.30, unit: m, source: "Measured, car #3, 2026-07-21"}
      height: {value: 0.20, unit: m, source: "Measured, car #3, 2026-07-21"}
    performance: {max_speed: {value: 1.5, unit: m/s, source: "Indoor safety"}}
    sensors:
      - {id: lidar, type: ust10lx, mount: {offset: {x: 0.12, y: 0.0, z: 0.18}}}
  - id: jam1
    platform: jammer
    network: red
    colour: "#C4685A"
    pose: {x: 0.5, y: 0.5, z: 0.0, yaw: 0.0}
    dimensions:
      length: {value: 0.30, unit: m, source: "Nominal emitter footprint"}
      width:  {value: 0.30, unit: m, source: "Nominal emitter footprint"}
      height: {value: 0.30, unit: m, source: "Nominal emitter footprint"}
    jammer:
      # 10 dBm at room centre gives a MIX - some blue links hold, some
      # degrade, some drop - so the gradient is visible, not a uniform wall.
      # Raise it (30 dBm = 1 W) for total denial, or move jam1 closer.
      tx_power: {value: 10, unit: dBm, source: ""}   # <-- real module datasheet
      band:     {value: 2400, unit: MHz, source: "Configured to blue's band"}
