# =============================================================================
# Deadband EXPERIMENT — authority_vs_jamming
# =============================================================================
# The proof-of-concept sweep. One question, asked properly:
#
#   Does the choice of COMMAND AUTHORITY change how much jamming a fleet can
#   absorb before it stops doing its job - and is that choice separable from
#   the ROUTING the packets take?
#
# The framework's claim is that authority (who decides) and routing (how
# packets travel) are independent axes, and that the interesting behaviour
# lives in the gap between them. This experiment is the smallest thing that
# can support or refute that claim, so it crosses both axes fully.
#
# An EXPERIMENT is a fourth layer above scene + fleet + mission: it names the
# composition once and then declares what is VARIED across runs. Nothing here
# describes the world or the command - those live in their own files.
#
# Run:   python3 tools/sweep.py experiments/authority_vs_jamming.yaml
# Replay one cell:
#        python3 tools/sweep.py experiments/authority_vs_jamming.yaml \
#                --replay 'authority=centralized,routing=star,jam_dbm=30,seed=1'
# =============================================================================

spec_version: 0.1
name: authority_vs_jamming
kind: experiment

description: >
  3 authorities x 3 routings x 10 jammer powers x 5 seeds = 450 runs of the
  benchmark shuttle mission on open ground, under a single GNSS+comms jammer.
  Measures how much of the fleet stays commanded, how far it gets, and how
  wrong its own position estimate becomes.

# --- the composition every run shares -----------------------------------------
scene: open_field
blue_fleet: 3_roboracer_no_lidar
red_fleet: red_jammer
mission: test

duration_s: 60.0        # sim seconds per run
warmup_s: 10.0          # clean spectrum first: the fleet gets going, then
                        # the jammer is armed. Metrics score the jammed window
                        # only, so the warm-up is not diluting the result.
rate_hz: 10.0

# --- what is varied -----------------------------------------------------------
axes:
  authority: [centralized, decentralized, hierarchical]
  routing:   [star, mesh, tiered]
  # dBm at the emitter. -999 is the OFF control - the same run with a silent
  # jammer, so every cell has its own uncontested baseline.
  jam_dbm:   [-999, -20, -10, -5, 0, 5, 10, 15, 20, 30]

seeds: [1, 2, 3, 4, 5]

# --- the jammer under test ----------------------------------------------------
# One emitter, splitting its power across the comms band and the GNSS band, so
# a single red asset attacks command authority AND position knowledge at once.
# This is the "both jammings" case; single-band variants are a later sweep.
jammer:
  id: jam1
  bands_mhz: [2400, 1575.42]

# --- hierarchy shape ----------------------------------------------------------
# With three cars the hierarchy is one squad: car1 leads, car2 and car3 follow,
# and car1 answers to the gcs. Declared here rather than in the fleet so the
# same fleet file serves all three authorities unchanged.
squads:
  alpha: {leader: car1, members: [car2, car3]}
coordinator: gcs
leader_loss: fallback
