# =============================================================================
# Deadband scenario - wall following, one car, nothing in the way
# =============================================================================
# A rig for developing and watching ONE behaviour. Everything that is not the
# wall follower has deliberately been taken out of its way:
#
#   * Cars 1 and 2 are STATIC and parked mid-arena. They are still real
#     obstacles - the lidar sees them and collision applies - but they are not
#     driving into the follower's lane. Set them shuttling again and it is a
#     much harder problem, which is a fair next experiment.
#
#   * The ground station is SUSPENDED at 1.5 m. Not a trick: pose.z is an
#     agent's BASE, so the gcs occupies [1.5, 2.5] m while the car's lidar
#     scans a plane at 0.18 m. It is therefore invisible to the scan, which is
#     exactly the out-of-plane case the sensor model exists to get right.
#     Drop it back to z: 0.0 and it reappears in the scan.
#
# Everything else - arena, radios, provenance - is the benchmark scenario
# unchanged, so runs here are comparable with three_car_fleet.yaml.
#
# THE PROVENANCE RULE: every physical quantity is {value, unit, source}.
# An empty source is allowed but it gets counted and flagged. Never invent one.
#
# CONVENTION: pose.z is the BASE of an agent (its ground contact), so an agent
# occupies [z, z + height]. This matters for lidar: a scan only sees obstacles
# whose vertical extent crosses the scan plane.
# =============================================================================

spec_version: 0.1
name: wall_follow_demo
description: >
  Car 3 follows the right-hand wall using its lidar. Cars 1 and 2 are parked as
  static obstacles and the ground station is suspended above the scan plane.
  The development rig for missions/wall_follow.py.

# -----------------------------------------------------------------------------
# ARENA
# -----------------------------------------------------------------------------
arena:
  type: box
  extent:
    x: 8.0
    y: 8.0
    z: 3.0                     # a room, not a cube - ceiling height

  # What the lidar sees when a beam lands on a wall. The datasheet gives 10 m
  # against a white Kent sheet and 4 m at 10% diffuse reflectance, so the
  # surface sets the useful range as much as the sensor does. Brick is matte and
  # dark: the low figure is the right default here.
  # NEEDS A MEASUREMENT for the real room - point a car at a wall and record
  # where returns stop.
  # Reflectance of the wall surface, 0..1 (or a percentage). Red brick and
  # concrete sit around 0.25-0.40 in the near infrared - well above the 10%
  # figure the datasheet uses for its worst case, and well below white paper.
  # NEEDS A MEASUREMENT: point a car at the wall and record where returns stop.
  surface_reflectivity: 0.30       # low | medium | high, or a number

  # solid | open | absorbing. 'solid' reflects RF (multipath).
  boundaries:
    x_min: solid
    x_max: solid
    y_min: solid
    y_max: solid
    z_min: solid               # floor
    z_max: solid               # ceiling

  propagation:
    model: indoor_multipath
    path_loss_exponent:
      value:                   # <-- NEEDS A SOURCE. Indoor propagation paper.
      unit: dimensionless
      source: ""
    shadowing_sigma:
      value:                   # <-- NEEDS A SOURCE.
      unit: dB
      source: ""

  spectrum:
    model: clean               # the control condition: nothing else transmitting
    background_emitters: []

  gnss:
    availability: denied       # indoors, no sky view

  wind:
    model: none

# -----------------------------------------------------------------------------
# NETWORKS
# -----------------------------------------------------------------------------
networks:
  blue:
    topology: centralized
    coordinator: gcs
    encrypted: true
    band: 2400                 # MHz
    qos:
      reliability: reliable
      deadline_ms: 100

# -----------------------------------------------------------------------------
# AGENTS
# -----------------------------------------------------------------------------
agents:

  - id: gcs
    platform: ground_station
    network: blue
    colour: "#6B7B85"
    pose: {x: 0.0, y: -3.4, z: 1.5, yaw: 1.5708}   # SUSPENDED above the scan plane
    dimensions:
      length: {value: 0.40, unit: m, source: "Nominal - measure the actual bench"}
      width:  {value: 0.40, unit: m, source: "Nominal - measure the actual bench"}
      height: {value: 1.00, unit: m, source: "Nominal - measure the actual bench"}
    radios: [wifi_2g4]
    mission: {type: static}
    ghost: true                # furniture for now: drawn and visible to lidar,
                               # but nothing collides with it

  - id: car1
    platform: roboracer
    network: blue
    colour: "#2E6FB0"
    pose: {x: -1.2, y: 1.4, z: 0.0, yaw: 0.0}
    dimensions:
      length: {value: 0.55, unit: m, source: "Measured, car #1, 2026-07-21"}
      width:  {value: 0.30, unit: m, source: "Measured, car #1, 2026-07-21"}
      height: {value: 0.20, unit: m, source: "Measured, car #1, 2026-07-21"}
      mass:   {value: , unit: kg, source: ""}            # <-- weigh it
    performance:
      max_speed:       {value: 1.5, unit: m/s,   source: "Chosen for indoor safety - not a platform limit"}
      max_accel:       {value: , unit: m/s^2, source: ""}
      min_turn_radius: {value: , unit: m,     source: ""}
    sensors:
      - id: lidar
        type: ust10lx
        mount:
          offset: {x: 0.12, y: 0.0, z: 0.18}
          rpy: {r: 0.0, p: 0.0, y: 0.0}
      - id: imu
        type: generic_imu
        mount:
          offset: {x: 0.0, y: 0.0, z: 0.05}
          rpy: {r: 0.0, p: 0.0, y: 0.0}
    radios: [wifi_2g4]
    controller: controllers/car1_shuttle.py
    on_link_loss: hold
    mission: {type: static}      # parked obstacle, not traffic

  - id: car2
    platform: roboracer
    network: blue
    colour: "#2E6FB0"
    pose: {x: 1.4, y: -0.6, z: 0.0, yaw: 1.5708}
    dimensions:
      length: {value: 0.55, unit: m, source: "Measured, car #2, 2026-07-21"}
      width:  {value: 0.30, unit: m, source: "Measured, car #2, 2026-07-21"}
      height: {value: 0.20, unit: m, source: "Measured, car #2, 2026-07-21"}
      mass:   {value: , unit: kg, source: ""}
    performance:
      max_speed:       {value: 1.5, unit: m/s, source: "Chosen for indoor safety"}
      max_accel:       {value: , unit: m/s^2, source: ""}
      min_turn_radius: {value: , unit: m,     source: ""}
    sensors:
      - id: lidar
        type: ust10lx
        mount:
          offset: {x: 0.12, y: 0.0, z: 0.18}
          rpy: {r: 0.0, p: 0.0, y: 0.0}
      - id: imu
        type: generic_imu
        mount:
          offset: {x: 0.0, y: 0.0, z: 0.05}
          rpy: {r: 0.0, p: 0.0, y: 0.0}
    radios: [wifi_2g4]
    controller: controllers/car2_shuttle.py
    on_link_loss: hold
    mission: {type: static}      # parked obstacle, not traffic

  - id: car3
    platform: roboracer
    network: blue
    colour: "#2E6FB0"
    pose: {x: -3.0, y: -3.0, z: 0.0, yaw: 0.0}   # beside the y_min wall
    dimensions:
      length: {value: 0.55, unit: m, source: "Measured, car #3, 2026-07-21"}
      width:  {value: 0.30, unit: m, source: "Measured, car #3, 2026-07-21"}
      height: {value: 0.20, unit: m, source: "Measured, car #3, 2026-07-21"}
      mass:   {value: , unit: kg, source: ""}
    performance:
      max_speed:       {value: 1.5, unit: m/s, source: "Chosen for indoor safety"}
      max_accel:       {value: , unit: m/s^2, source: ""}
      min_turn_radius: {value: , unit: m,     source: ""}
    sensors:
      - id: lidar
        type: ust10lx
        mount:
          offset: {x: 0.12, y: 0.0, z: 0.18}
          rpy: {r: 0.0, p: 0.0, y: 0.0}
      - id: imu
        type: generic_imu
        mount:
          offset: {x: 0.0, y: 0.0, z: 0.05}
          rpy: {r: 0.0, p: 0.0, y: 0.0}
    radios: [wifi_2g4]
    controller: controllers/car3_shuttle.py
    on_link_loss: hold
    mission:
      type: script
      file: missions/wall_follow.py
      side: right                # right | left
      standoff: 0.8              # metres to hold off the wall
      lookahead: 1.2             # metres ahead to aim
      gain: 0.9                  # rad of steering per metre of distance error

# -----------------------------------------------------------------------------
# RADIO DEFINITIONS
# -----------------------------------------------------------------------------
radios:
  wifi_2g4:
    band:         {value: 2400, unit: MHz, source: "Configured"}
    tx_power:     {value: , unit: dBm,  source: ""}    # <-- module datasheet
    sensitivity:  {value: , unit: dBm,  source: ""}    # <-- module datasheet
    bandwidth:    {value: , unit: MHz,  source: ""}
    data_rate:    {value: , unit: Mbps, source: ""}
    antenna_gain: {value: , unit: dBi,  source: ""}
    link_type: rf_omni

# -----------------------------------------------------------------------------
# ATTACKS - none. This is the control condition.
# -----------------------------------------------------------------------------
attacks: []

run:
  duration_s: 180
  seed: 1
  realtime_factor: 1.0

logging:
  rosbag: true
  metrics: [pdr, latency, link_uptime, position_error]
  output_dir: runs/

# =============================================================================
# WHAT TO WATCH
#
# Car 3 should settle onto the standoff within a couple of metres and stay
# there, corners included. What it must NOT do is bounce - close on the wall,
# over-correct, swing out, come back. That is the failure mode a one-beam wall
# follower has by construction, and it is why this one reads two beams and
# steers on where it WILL be rather than where it is.
#
# Worth changing, in rising order of difficulty:
#   side: left            - the mirror case; catches sign errors immediately
#   standoff: 0.4         - tighter line, less margin at the corners
#   gain: 2.5             - deliberately too high; watch it start to hunt
#   cars 1 and 2 shuttling again - a moving obstacle in the lane
#   gcs pose z: 0.0       - the ground station drops into the scan plane
# =============================================================================
