      width:  {value: 0.30, unit: m, source: "Measured, car #2, 2026-07-21"}
      height: {value: 0.20, unit: m, source: "Measured, car #2, 2026-07-21"}
      mass:   {value: , unit: kg, source: ""}
    performance:
      max_speed:       {value: 1.5, unit: m/s, source: "Chosen for indoor safety"}
      max_accel:       {value: , unit: m/s^2, source: ""}
      min_turn_radius: {value: , unit: m,     source: ""}
    sensors:
      - id: lidar
        type: ust10lx
        mount:
          offset: {x: 0.12, y: 0.0, z: 0.18}
          rpy: {r: 0.0, p: 0.0, y: 0.0}
      - id: imu
        type: generic_imu
        mount:
          offset: {x: 0.0, y: 0.0, z: 0.05}
          rpy: {r: 0.0, p: 0.0, y: 0.0}
    radios: [wifi_2g4]
    controller: controllers/car2_shuttle.py
