# -----------------------------------------------------------------------------
# POINTS OF INTEREST — named landmarks a mission can refer to
# -----------------------------------------------------------------------------
# The three lanes run left-right at y = +2, 0, -2. A/B top, C/D middle, E/F
# bottom. A mission says "shuttle between A and B"; this map says where they are.

# -----------------------------------------------------------------------------
# RADIO DEFINITIONS
# -----------------------------------------------------------------------------
radios:
  wifi_2g4:
    band:         {value: 2400, unit: MHz, source: "Configured"}
    tx_power:     {value: , unit: dBm,  source: ""}    # <-- module datasheet
    sensitivity:  {value: , unit: dBm,  source: ""}    # <-- module datasheet
    bandwidth:    {value: , unit: MHz,  source: ""}
    data_rate:    {value: , unit: Mbps, source: ""}
    antenna_gain: {value: , unit: dBi,  source: ""}
    link_type: rf_omni
