# Built in the Console's custom fleet builder.
# Values are NOMINAL, not measured - the provenance report will say so.
spec_version: 0.1
name: custom_red
kind: fleet
description: Composed in the Console from agents/. Declares no authority, routing
  or doctrine - those are picked in Setup.
networks:
  red:
    system: adversary
    band: 2400
agents:
- id: jam1
  platform: jammer
  agent_type: jam_single
  network: red
  colour: '#C4685A'
  pose:
    x: 0.0
    y: 3.0
    z: 0.0
    yaw: 0.0
  dimensions:
    length:
      value: 0.3
      unit: m
      source: Nominal - not measured
    width:
      value: 0.3
      unit: m
      source: Nominal - not measured
    height:
      value: 0.3
      unit: m
      source: Nominal - not measured
  jammer:
    tx_power:
      value: 10
      unit: dBm
      source: ''
    band:
      value: 2400
      unit: MHz
      source: Default only - retune live
