# Built in the Console's custom fleet builder.
# Values are NOMINAL, not measured - the provenance report will say so.
spec_version: 0.1
name: custom_blue
kind: fleet
description: Composed in the Console from agents/. Declares no authority, routing
  or doctrine - those are picked in Setup.
networks:
  blue:
    system: friendly
    band: 2400
    coordinator: gcs
agents:
- id: gcs
  platform: ground_station
  agent_type: ground_station
  network: blue
  colour: '#2E6FB0'
  pose:
    x: 0.0
    y: -3.4
    z: 0.0
    yaw: 0.0
  dimensions:
    length:
      value: 0.4
      unit: m
      source: Nominal - measure the bench
    width:
      value: 0.4
      unit: m
      source: Nominal - measure the bench
    height:
      value: 1.0
      unit: m
      source: Nominal - measure the bench
  performance:
    max_speed:
      value: 0.0
      unit: m/s
      source: Nominal - measure the bench
    max_accel:
      value: 1.0
      unit: m/s^2
      source: Nominal - measure the bench
    min_turn_radius:
      value: 1.0
      unit: m
      source: Nominal - measure the bench
  ghost: true
- id: car1
  platform: roboracer
  agent_type: roboracer
  network: blue
  colour: '#2E6FB0'
  pose:
    x: -3.0
    y: 2.0
    z: 0.0
    yaw: 0.0
  dimensions:
    length:
      value: 0.55
      unit: m
      source: 'Measured, car #1, 2026-07-21'
    width:
      value: 0.3
      unit: m
      source: 'Measured, car #1, 2026-07-21'
    height:
      value: 0.2
      unit: m
      source: 'Measured, car #1, 2026-07-21'
  performance:
    max_speed:
      value: 1.5
      unit: m/s
      source: 'Measured, car #1, 2026-07-21'
    max_accel:
      value: 2.0
      unit: m/s^2
      source: 'Measured, car #1, 2026-07-21'
    min_turn_radius:
      value: 0.6
      unit: m
      source: 'Measured, car #1, 2026-07-21'
  sensors:
  - id: imu
    type: generic_imu
    mount:
      offset:
        x: 0.0
        y: 0.0
        z: 0.05
