# =============================================================================
# Deadband MISSION — forward
# =============================================================================
# NO GOALS AT ALL, and that is the point of it.
#
# `advance` with no destination means "hold this heading and keep going until
# something stops you" — a wall, or losing your commander. There is nothing to
# choose and nothing to arrive at, so it is the one mission with no end and no
# pass/fail: it is a probe, not a task.
#
# Use it to FIND the limit rather than assume one. Where a fleet stops under a
# given jammer is a measurement; picking a distance and asking whether it got
# there is a guess you then have to defend.
#
#     SETMISSION forward
#     blue launch
# =============================================================================

spec_version: 0.1
name: forward
kind: mission

description: >
  Every vehicle drives forward until a wall or until it loses command. No
  destination, so no arrival and no score - the probe that measures where the
  limit actually is.

objectives:
  all: {do: advance}
