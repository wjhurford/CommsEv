# REMOVED — shuttle is patrol with two points
# =============================================================================
# Patrolling two points IS shuttling, so there is no reason for both to exist
# and every reason for there not to be: two names for one behaviour is two
# places to look and two things to keep in step.
#
# Use missions/patrol.yaml with two goals.
#
# `shuttle` survives as an OBJECTIVE verb for a single vehicle - REOBJECTIVE
