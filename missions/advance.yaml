# =============================================================================
# CommsEv MISSION — advance
# =============================================================================
# GO THERE. THEN THERE. THEN THERE. ONCE EACH.
#
# `goals: any` means the mission does not decide how many points it wants -
# you do, in Setup, by adding goal slots. One point is the penetration
# command. Three points is a route. The mission is the SHAPE of the task; the
# geometry is a decision about this run and belongs to whoever is running it.
#
# `laps: 1` is what makes it advance rather than patrol: every point is
# visited once, in order, and then the mission is finished. Patrol is the
# same thing with the circuit repeated - which is why there is no separate
# shuttle mission any more. Patrolling two points IS shuttling.
#
# THE OBJECTIVE IS ALWAYS JUST "GO THERE". The coordinator holds the route and
# hands each vehicle one leg at a time; when it reports arriving, the next leg
# is sent. Formation is preserved throughout - each vehicle keeps its offset
# from the formation's centre, so a wedge stays a wedge - unless you
# deliberately REOBJECTIVE one vehicle onto something else.
#
#   Setup      choose the mission, add goal slots, point each at a point
#   terminal   SETMISSION advance to P1 P2 P3
#              blue launch
# =============================================================================

spec_version: 0.1
name: advance
kind: mission

description: >
  The fleet visits each chosen point once, in order, in whatever formation it
  is in. One point is the penetration command. Passed by a vehicle that
  reaches them all; failed by one that does not, or one that reports an
  arrival it did not make. Fits any fleet, any size, any shape, any scene.

plan:
  who: all
  goals: any        # you choose how many, in Setup
  laps: 1           # each point once - that is what makes it advance
