# =============================================================================
# Deadband MISSION — advance
# =============================================================================
# ONE GOAL. THE MISSION DOES NOT SAY WHERE IT IS.
#
# `goals: 1` means "this mission needs one point; you say which". It used to
# say `to: FAR`, which welded it to the one scene that had a point by that
# name and, worse, let the scene author decide the objective.
#
# `advance` moves THE FLEET so its centre lands on the goal, with each vehicle
# holding its offset from the formation's centre - so a wedge stays a wedge, a
# column stays a column, and the shape you spawned is the shape that advances.
# Nothing here is hardcoded to a fleet size, a fleet's names, or a scene.
#
# It is a MISSION, not an objective: one lap of one point, so it has an end
# and can be passed or failed. The penetration experiment is this file.
#
#   Setup      choose the mission, then pick its goal from your points
#   terminal   SETMISSION advance to P1
#              blue launch
# =============================================================================

spec_version: 0.1
name: advance
kind: mission

description: >
  The fleet advances to one chosen point in whatever formation it is in. The
  penetration command: how far can this fleet get into contested spectrum
  before it loses command? Fits any fleet, any size, any shape, any scene.

plan:
  who: all
  goals: 1
  laps: 1
