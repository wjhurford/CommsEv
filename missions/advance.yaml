# =============================================================================
# Deadband MISSION — advance
# =============================================================================
# ONE LINE. NO AGENT NAMES. NO FLEET SIZE.
#
# `all` is every mobile vehicle, whatever the fleet calls them and however
# many there are. `advance` moves THE FLEET so its centre lands on FAR, with
# each vehicle holding its offset from the formation's centre - so a wedge
# stays a wedge, a column stays a column, and the shape you spawned is the
# shape that advances.
#
# This replaces a mission that wrote a lane per vehicle. That version only
# ever fitted a fleet of exactly three, in exactly that arrangement; change
# the fleet and it tasked nobody. Nothing here is hardcoded to a fleet.
#
# Drop the `to:` and it becomes "go forward until something stops you" - a
# wall, or losing your commander. Both forms are in COMMANDS.md.
#
#     SETMISSION advance
#     blue launch
# =============================================================================

spec_version: 0.1
name: advance
kind: mission

description: >
  The fleet advances to FAR in whatever formation it is in. The penetration
  command: how far can this fleet get into contested spectrum before it loses
  command? Fits any fleet, any size, any shape.

objectives:
  all: {do: advance, to: FAR}
