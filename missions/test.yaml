# =============================================================================
# Deadband MISSION — test
# =============================================================================
# A MISSION is the COMMAND, and nothing else: objectives for agents, applied
# to whatever fleet is running, on whatever scene it was set up in. It names
# NO scene and NO fleet - the Setup tab composes those, and the mission is set
# from the terminal, before launch:
#
#     SETMISSION test
#     blue launch
#
# This one is the benchmark: three cars shuttling their own lanes - the
# control condition everything else is measured against. See
# docs/vocabulary.md.
#
# Will's definition: a system/fleet-wide command.
#
# Objectives are verbs on named points, never coordinates - "shuttle between
# A and B" is portable to any scene that defines A and B. Retask any of it
# live from the Console (REOBJECTIVE / REMISSION / LOADMISSION).
# =============================================================================

spec_version: 0.1
name: test
kind: mission

description: >
  Three cars shuttling three lanes. The benchmark command - the control
  condition everything else is measured against. Needs a fleet with car1-3
  and a scene defining points A-F.


objectives:
  # LITERAL COORDINATES, deliberately, and this is the ONE mission that should
  # have them. It is a fixed benchmark: the control condition everything else
  # is measured against, which means it has to be identical every time and
  # must not depend on points somebody set up differently this morning.
  #
  # Every other mission names no geometry at all - it asks for N goals and the
  # run says where they are. That is what makes one mission file run on any
  # scene. This one is the exception that proves it: welded on purpose,
  # because a benchmark that moves is not a benchmark.
  #
  # It needs a fleet whose vehicles are called car1, car2, car3; any other
  # fleet gets a loud refusal naming what it asked for and what is running.
  car1: {do: shuttle, between: [{x: -3.0, y:  2.0}, {x: 3.0, y:  2.0}]}
  car2: {do: shuttle, between: [{x: -3.0, y:  0.0}, {x: 3.0, y:  0.0}]}
  car3: {do: shuttle, between: [{x: -3.0, y: -2.0}, {x: 3.0, y: -2.0}]}
