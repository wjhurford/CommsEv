# Required by ament_python.
#
# ROS 2 looks for a package's executables in <install>/lib/<package_name>, but
# setuptools installs console_scripts to <install>/bin by default. Without these
# two lines the build reports success and `ros2 run` then cannot find anything —
# the failure surfaces much later than its cause, which is what makes it a
# classic. Every ament_python package carries this file.
[develop]
script_dir=$base/lib/commsev_ros

[install]
install_scripts=$base/lib/commsev_ros
