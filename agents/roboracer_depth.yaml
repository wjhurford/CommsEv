# =============================================================================
# CommsEv AGENT — roboracer_depth
# =============================================================================
# An AGENT FILE IS HARDWARE. It describes a thing you could buy, bolt together
# and put on a bench. Nothing here is a decision - no network, no authority, no
# routing, no doctrine, no pose, no objective. Those are chosen in the Console.
#
# THE SAME CAR, A DIFFERENT EYE, AND THE DIFFERENCE IS THE POINT.
#
# roboracer_lidar carries a Hokuyo UST-10LX: 270 degrees, 10 m, one horizontal
# plane. This one carries an Intel RealSense D435i: 87 degrees, 0.3-3 m, a
# volume. They fail in opposite directions.
#
#   In a ROOM        both work. The camera sees the near wall in 3D; the lidar
#                    sees every wall at once in 2D.
#   In a CORRIDOR    20 m wide, the camera has nothing in range. It is a
#                    3 m sensor in a space whose nearest feature is 10 m away,
#                    so the car dead-reckons however good the camera is.
#   BEHIND the car   the lidar sees it. The camera does not - 87 degrees is a
#                    window, not a sweep.
#
# That is why both exist in this repo: which sensor keeps a fleet localised
# under GNSS denial is a property of the SCENE as much as of the vehicle, and
# one sensor cannot show that.
# =============================================================================

spec_version: 0.1
name: roboracer_depth
kind: agent

description: >
  F1TENTH-class ground vehicle with an Intel RealSense D435i. Depth and a
  6-DoF IMU in one package, so it can run visual-inertial odometry - but only
  where there is something within about three metres to look at.

platform: roboracer

dimensions:
  length: {value: 0.55, unit: m, source: "Measured, car #1, 2026-07-21"}
  width:  {value: 0.3,  unit: m, source: "Measured, car #1, 2026-07-21"}
  height: {value: 0.2,  unit: m, source: "Measured, car #1, 2026-07-21"}

radio:
  tx_power: {value: 20, unit: dBm, source: ""}   # <-- module datasheet

performance:
  max_speed:       {value: 1.5, unit: m/s,   source: "Measured, car #1, 2026-07-21"}
  max_accel:       {value: 2.0, unit: m/s^2, source: "Measured, car #1, 2026-07-21"}
  min_turn_radius: {value: 0.6, unit: m,     source: "Measured, car #1, 2026-07-21"}

sensors:
  # Intel RealSense D435i, forward, on the roll hoop.
  #   depth FOV        87 x 58 deg
  #   minimum depth    ~0.28 m
  #   ideal range      0.3 - 3 m
  #   accuracy         <2% at 2 m   (proportional, not a fixed millimetre band)
  #   depth stream     up to 1280x720, up to 90 fps
  #   colour           1920x1080 at 30 fps
  #   IMU              6 DoF, integrated - the `i` in D435i
  # Source: Intel RealSense D435i product specification.
  - {id: depth, type: d435i, mount: {offset: {x: 0.12, y: 0.0, z: 0.14}}}
  # The chassis IMU, separate from the camera's own.
  - {id: imu, type: generic_imu, mount: {offset: {x: 0.0, y: 0.0, z: 0.05}}}
