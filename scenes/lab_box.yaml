# =============================================================================
# CommsEv SCENE — lab_box
# =============================================================================
# A SCENE is the WORLD ONLY: the arena, the radio medium and contested
# background (propagation, spectrum, GNSS, wind), and named POINTS a mission
# can refer to. NO agents, NO networks, NO tasking — the fleet is a FLEET file
# (fleets/3_roboracer.yaml) and the tasking is a MISSION (missions/test.yaml).
# See docs/vocabulary.md.
#
# THE PROVENANCE RULE still applies: every physical quantity is {value, unit,
# source}. An empty source is allowed but counted and flagged. Never invent one.
#
# CONVENTION: pose.z is the BASE of an agent (its ground contact).
# =============================================================================

spec_version: 0.1
name: lab_box
kind: scene

description: >
  The lab: an 8x8 bounded indoor box. Clean spectrum, GNSS denied (indoors).
  Points A-F mark the ends of the three lanes; HOME is the ground-station
  bench. The world half of the lab setup - drop a fleet on it with a mission.

# -----------------------------------------------------------------------------
# ARENA
# -----------------------------------------------------------------------------
arena:
  type: box
  extent:
    x: 8.0
    y: 8.0
    z: 3.0                     # a room, not a cube - ceiling height

  # What the lidar sees when a beam lands on a wall. The datasheet gives 10 m
  # against a white Kent sheet and 4 m at 10% diffuse reflectance, so the
  # surface sets the useful range as much as the sensor does. Brick is matte and
  # dark: the low figure is the right default here.
  # NEEDS A MEASUREMENT for the real room - point a car at a wall and record
  # where returns stop.
  # Reflectance of the wall surface, 0..1 (or a percentage). Red brick and
  # concrete sit around 0.25-0.40 in the near infrared - well above the 10%
  # figure the datasheet uses for its worst case, and well below white paper.
  # NEEDS A MEASUREMENT: point a car at the wall and record where returns stop.
  surface_reflectivity: 0.30       # low | medium | high, or a number

  # solid | open | absorbing. 'solid' reflects RF (multipath).
  boundaries:
    x_min: solid
    x_max: solid
    y_min: solid
    y_max: solid
    z_min: solid               # floor
    z_max: solid               # ceiling

  propagation:
    model: indoor_multipath
    path_loss_exponent:
      value:                   # <-- NEEDS A SOURCE. Indoor propagation paper.
      unit: dimensionless
      source: ""
    shadowing_sigma:
      value:                   # <-- NEEDS A SOURCE.
      unit: dB
      source: ""

  spectrum:
    model: clean               # the control condition: nothing else transmitting
    background_emitters: []
    # The resting noise power every receiver integrates - the denominator of
    # every SINR before anyone transmits, which is why the SCENE owns it:
    # jamming and congestion are measured as departures from THIS. -95 dBm is
    # the defensible indoor default rf_link() currently assumes; measuring it
    # in the actual room replaces the assumption everywhere at once.
    noise_floor:
      value: -95
      unit: dBm
      source: ""               # <-- NEEDS A MEASUREMENT: spectrum analyser, quiet room

  gnss:
    availability: denied       # indoors, no sky view

  wind:
    model: none

# -----------------------------------------------------------------------------
# NETWORKS
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# POINTS OF INTEREST — named landmarks a mission can refer to
# -----------------------------------------------------------------------------
# The three lanes run left-right at y = +2, 0, -2. A/B top, C/D middle, E/F
# bottom. A mission says "shuttle between A and B"; this map says where they are.
# NO POINTS. Deliberately - see scenes/corridor_200m.yaml for the full
# reasoning. A scene is the WORLD; where you send a fleet inside it is a
# decision about THIS RUN, and it belongs to whoever is running it.
#
# This file used to name A..F: three lanes across the room, which is not
# geometry, it is a mission somebody wrote once. Points are now created where
# they are decided - Setup -> Add point - named P1, P2, ... and they ride with
# the composed run, so what a result was measured against is recorded with it.

# -----------------------------------------------------------------------------
# RADIO DEFINITIONS
# -----------------------------------------------------------------------------
