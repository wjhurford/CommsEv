# =============================================================================
# Deadband SCENE — corridor_200m
# =============================================================================
# The penetration experiment. A 200 m corridor with the ground station at one
# end and the adversary at the other. A fleet advances from HOME toward FAR
# and gets progressively further from its commander AND closer to the jammer -
# a double gradient, which is exactly what a single centrally-placed emitter
# fails to produce.
#
# WHY THE GEOMETRY MATTERS. In a 20 m box a jammer sits roughly equidistant
# from everything, so every link degrades together and the topology has
# nothing to route around. Stretched over 200 m the links differ by tens of
# dB at the same instant, and whether a fleet can relay around the weak ones
# becomes the whole question.
#
# GNSS is available, so a GNSS-band jammer is a separate, deliberate attack
# rather than a property of the room. Open ground: no walls for a lidar to
# localise against.
# =============================================================================

spec_version: 0.1
name: corridor_200m
kind: scene

description: >
  200 x 40 m open corridor. Ground station at one end, adversary at the other.
  The rig for measuring how far a fleet can advance into contested spectrum
  before it loses command.

arena:
  type: box
  extent: {x: 200.0, y: 40.0, z: 20.0}
  surface_reflectivity: low
  boundaries: {x_min: open, x_max: open, y_min: open, y_max: open}

background:
  propagation:
    path_loss_exponent: {value: 2.2, unit: "", source: ""}   # near free space
    noise_floor: {value: -95, unit: dBm, source: ""}
  spectrum:
    band: {value: 2400, unit: MHz, source: ""}
  gnss:
    availability: available
  wind:
    speed: {value: 0.0, unit: "m/s", source: ""}

# NO POINTS. Deliberately.
#
# A scene is the WORLD - its geometry, its walls, its radio background. Where
# you decide to send a fleet inside it is a decision about THIS RUN, and it
# belongs to whoever is running it, not to whoever wrote the scene.
#
# This file used to name HOME, FAR, APEX, WINGL and WINGR, and every one of
# them was really an objective in disguise. APEX/WINGL/WINGR were a wedge's
# formation slots - a fleet's shape, hardcoded into the room it happens to be
# standing in, which is exactly what formations-as-functions removed. HOME and
# FAR were the ends of one particular mission.
#
# Points are now created where they are decided: Setup -> Add point, typed or
# dragged, named P1, P2, ... They ride with the composed run, so what a result
# was measured against is recorded with it.
#
# A scene MAY still declare points - lab_box and open_field keep A..F, because
# those lanes are the fixed geometry of a benchmark that has to be identical
# every time. That is a scene making a claim about itself, which is fine. A
# corridor claiming to know where you want to go is not.
